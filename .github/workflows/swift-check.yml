name: Swift Native Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-check:
    name: Validate Swift Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Validate Swift package manifest
        run: swift package dump-package --package-path ChatWave.swiftpm > /dev/null

      - name: Verify native project contains no web stack
        shell: bash
        run: |
          test -f ChatWave.swiftpm/Package.swift
          test -f ChatWave.swiftpm/Sources/ChatWave/main.swift
          ! find . -type f \( -name '*.js' -o -name '*.ts' -o -name '*.tsx' -o -name '*.jsx' -o -name 'package.json' \) -not -path './.git/*' | grep -q .
